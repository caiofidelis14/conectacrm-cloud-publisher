name: Publicar Advogado de Elite — mensal

on:
  schedule:
    - cron: "0 11 * * 1"
      timezone: "America/Sao_Paulo"
  workflow_dispatch:
    inputs:
      slot:
        description: "Linha editorial"
        required: true
        type: choice
        options: [educational, aggressive, sales]
        default: educational
      publish:
        description: "Publicar de verdade?"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: elite-instagram-${{ github.event.schedule || inputs.slot }}
  cancel-in-progress: false

jobs:
  monthly-check:
    runs-on: ubuntu-latest
    outputs:
      should_publish: ${{ steps.schedule.outputs.should_publish }}
    steps:
      - id: schedule
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "should_publish=true" >> "$GITHUB_OUTPUT"
          else
            day=$(TZ=America/Sao_Paulo date +%d)
            if (( 10#$day <= 7 )); then
              echo "should_publish=true" >> "$GITHUB_OUTPUT"
            else
              echo "should_publish=false" >> "$GITHUB_OUTPUT"
            fi
          fi
  publish:
    needs: monthly-check
    if: needs.monthly-check.outputs.should_publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Definir linha editorial
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            slot="${{ inputs.slot }}"
          else
            month=$(TZ=America/Sao_Paulo date +%m)
            case $(((10#$month + 1) % 3)) in
              0) slot="educational" ;;
              1) slot="aggressive" ;;
              2) slot="sales" ;;
            esac
          fi
          echo "POST_SLOT=$slot" >> "$GITHUB_ENV"
          echo "MANIFEST_PATH=elite-manifest-$slot.json" >> "$GITHUB_ENV"
      - name: Validar acesso de publicação
        env:
          META_ACCESS_TOKEN: ${{ secrets.ELITE_META_ACCESS_TOKEN }}
          IG_USER_ID: "17841401203630772"
          EXPECTED_USERNAME: "advogadodeelitee"
        run: npm run validate-meta
      - name: Criar post original
        run: npm run generate-elite
      - name: Disponibilizar imagem
        shell: bash
        run: |
          git config user.name "Advogado de Elite Bot"
          git config user.email "actions@users.noreply.github.com"
          git add public/elite elite-manifest-*.json elite-history.json
          git diff --cached --quiet || git commit -m "content: advogado de elite $POST_SLOT $(date +%F)"
          for attempt in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && break
            [[ "$attempt" == "3" ]] && exit 1
            sleep 5
          done
      - name: Aguardar imagem pública
        if: github.event_name == 'schedule' || inputs.publish == true
        run: sleep 20
      - name: Publicar no Instagram
        if: github.event_name == 'schedule' || inputs.publish == true
        env:
          META_ACCESS_TOKEN: ${{ secrets.ELITE_META_ACCESS_TOKEN }}
          IG_USER_ID: "17841401203630772"
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: npm run publish
