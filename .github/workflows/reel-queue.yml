name: Fila temporária de Reels pessoais

on:
  schedule:
    # 15:00 UTC = 12:00 em Brasília. Horário UTC explícito evita atraso por timezone.
    - cron: "0 15 * * *"
  workflow_dispatch:
    inputs:
      date:
        description: "Data da fila (AAAA-MM-DD); vazio usa hoje"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: personal-reel-queue
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - id: queue
        name: Localizar Reel de hoje
        shell: bash
        run: |
          DATE="${{ inputs.date }}"
          if [ -z "$DATE" ]; then DATE=$(TZ=America/Sao_Paulo date +%F); fi
          MANIFEST="reels/$DATE.json"
          if [ -f "$MANIFEST" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "manifest=$MANIFEST" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Sem Reel na fila para $DATE."
          fi
      - name: Validar conta pessoal na Meta
        if: steps.queue.outputs.exists == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.PERSONAL_META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.PERSONAL_IG_USER_ID }}
          EXPECTED_USERNAME: "caiofidelis.elite"
        run: npm run validate-meta
      - name: Publicar Reel
        if: steps.queue.outputs.exists == 'true'
        env:
          META_ACCESS_TOKEN: ${{ secrets.PERSONAL_META_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.PERSONAL_IG_USER_ID }}
          MANIFEST_PATH: ${{ steps.queue.outputs.manifest }}
          PUBLIC_BASE_URL: https://raw.githubusercontent.com/${{ github.repository }}/main
        run: npm run publish-reel
